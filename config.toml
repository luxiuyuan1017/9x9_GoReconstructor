# =============================================================================
#  9x9_KataReconstructor 配置文件
#  所有可调参数都在这个文件里；prior/ 下的脚本不藏任何数值默认值。
#  改完直接重跑脚本即可，脚本启动时会打印本次实际生效的参数。
# =============================================================================
#
#  给谁用：
#    [engine] / [engine.search] / [game] / [katago_loss]
#        任务二（prior/output_katago_loss.py，KataGo 单手 loss 热图）
#        任务三（prior/output_reconstruction_loss.py）只用 [game] 与 [terminal_loss]
#    [terminal_loss]
#        任务三（重建损失的固定终盘项）
#
# =============================================================================


# -----------------------------------------------------------------------------
# [engine] 本地冻结的 KataGo 与模型
# -----------------------------------------------------------------------------
[engine]

# 下面三个路径都相对**本文件夹**，整个目录可以整体搬走，不依赖文件夹外的内容；
# 填绝对路径也可以。
# KataGo 可执行程序（本文件夹内的 katago/ 目录已含 exe 与所需 DLL）：
katago_path = "katago/katago.exe"

# 模型权重（冻结，不训练、不替换）：
model_path = "model/g170e-b15c192-s1672170752-d466197061.txt.gz"

# 官方 analysis 配置（本文件夹内的 katago/ 目录已附）
analysis_config = "katago/analysis_config.cfg"

# 首次查询等待上限（毫秒）。要留够第一次 GPU 自动调优的时间（本机约 10 分钟）。
startup_timeout_ms = 1800000

# 单条查询等待上限（毫秒）。
query_timeout_ms = 600000

# 额外传给 KataGo 的覆盖项（-override-config）。各项含义：
#   numAnalysisThreads  分析线程数（同时处理几条查询）
#   numSearchThreads    单条查询内的搜索线程数
#   nnMaxBatchSize      神经网络批大小；小一些省显存/内存，代价是吞吐
#   nnRandomize         true 会给同一局面的重复查询引入随机性（结果不可复现），
#                       做损失分析要可复现，所以设为 false
overrides = { numAnalysisThreads = 1, numSearchThreads = 1, nnMaxBatchSize = 2, nnRandomize = false }


# -----------------------------------------------------------------------------
# [engine.search] 每手查询的搜索预算
# -----------------------------------------------------------------------------
[engine.search]

# 搜索数：每手查询的 visits 上限。任务二用它取该手的原始 policy。
maxVisits = 100

# 必须显式关闭：false 表示保留候选历史对预测的影响（true 会忽略历史，预测失真）。
ignorePreRootHistory = false


# -----------------------------------------------------------------------------
# [search] 主程序（main/main.py）的按层启发式搜索
#
# 每层把"所有父候选展开出的全部合法子节点"合并成一个池，按**每步平均 loss** 从小到大
# 统一保留 beam_width 条；重复直到有候选盘面与目标终盘逐点一致（成功），
# 或所有路径都超过 max_moves 手（杀路径）。
# -----------------------------------------------------------------------------
[search]

# 每层全局保留的活动路径数 n（main.py 要求 50）。不是每个父节点各留 n 条。
beam_width = 50

# 成功时最多输出多少条路径的 SGF（main.py 要求 5）。
top_k = 10

# 单条路径的最大手数；超过即杀死该路径（main.py 要求 100）。
max_moves = 100

# 搜索总时间预算（秒）。到点即停止并报告目前最好结果。
time_budget_s = 3600.0

# KataGo 查询次数上限（防止跑太久）。
engine_query_budget = 20000

# 目标还缺多少棋子的"倒计时"权重，用来把搜索引向终盘：
#   0  -> 完全按平均 loss 排序（严格按 main.py 的描述）
#   >0 -> 排序键 = 每步平均 loss + progress_weight * (与目标不一致的点数 / 已下手数)
# 它只影响排序，不计入报告出来的 loss 数值。
progress_weight = 1.0

# KataGo 项权重 alpha：单步代价 = alpha * (-log p_K) + lambda * L_终盘
#   alpha = 1 即项目说明第 6 节的原始定义（当前就是 1，保持原有权重）。
alpha_katago = 1.0


# -----------------------------------------------------------------------------
# [game] 规则与棋盘
# -----------------------------------------------------------------------------
[game]

# 棋盘边长（本项目为 9 路）。
board_size = 9

# 规则名，会传给 KataGo，并在读取局面 SGF 时与 RU 属性校验是否一致。
rules = "chinese"

# 贴目，会传给 KataGo，并与局面 SGF 里的 KM 校验。
komi = 7.5


# -----------------------------------------------------------------------------
# [terminal_loss] 任务三：固定终盘点位重建损失
#
# 这张表由**终局局面**在整张棋盘上算一次，整次搜索不变，与任何中间盘面无关。
# 以"当前准备落子的颜色"看终局信息，分成下面几档：
#
#   终盘为同色棋子                     -> 0（全局唯一最小值）
#   终盘为对方棋子（普通）              -> opponent_stone_penalty
#   终盘为对方棋子，且该点在本方团块内部 -> interior_stone_penalty_*
#   终盘为空，空区只被对方完全包围       -> mode 指定的面积曲线（受 max_penalty 截断）
#   终盘为空，自己完全包围 / 中立空区     -> closed_empty_penalty
#
# "本方团块内部"的定义：该点相邻的**全部在盘内**棋子都是同色
# （角上只有 2 个邻点、边上 3 个、其余 4 个，只看在盘内的）。
# 这类点往往是曾经发生提子的地方，历史上更可能真放过对方的子，所以代价更低。
# -----------------------------------------------------------------------------
[terminal_loss]

# 整体系数 lambda：终盘项在总代价里的权重（总代价 = KataGo 项 + lambda * 终盘项）。
# 设为 0 可得到纯 KataGo 代价的对照。
lambda_total = 1.0

# 对方包围空区的面积曲线形式：
#   "exp"    -> base_temp_penalty * exp(area_coefficient * area) - offset   （默认）
#   "linear" -> base_temp_penalty + area_coefficient * area - offset        （对照用）
mode = "exp"

# 曲线前系数（要不要再乘一个系数）。取 1.0 表示不乘。
base_temp_penalty = 1.0

# 面积系数 k，控制"随面积变贵"的速度。exp 形式建议取小值。
# 当前 exp(0.2 * area) - 1 的效果（再被 max_penalty 截断到 20）：
#   面积  0 ->   0.00    面积  1 ->   0.22    面积  3 ->   0.82
#   面积  6 ->   2.32    面积  7 ->   3.06    面积 10 ->   6.39
#   面积 12 ->  10.02    面积 15 ->  19.09    面积 16 起触顶 20.00
area_coefficient = 0.2

# 曲线整体下移量。取 1.0 使面积 0 时恰好为 0（exp(0) - 1 = 0）。
offset = 1.0

# 对方包围空区罚分的截断上限。设为 0 或负数表示不截断。
# 当前 20.0：面积约 16 起触顶（exp(0.2*15)-1 = 19.09，面积 16 -> 23.53 被截到 20.0）。
max_penalty = 20.0

# 终盘为空、但空区不是"只被对方完全包围"时的罚分：自己完全包围的空区，或中立空区。
# 这两类填子都不可能是历史，取一档大的有限罚分。
closed_empty_penalty = 20

# 终盘为对方棋子（普通点）的罚分。这是搜索把棋子放对位置的主要路径
# （对方这块子被提掉、自己在此落子才能变成同色），所以不能设成最贵的一档。
opponent_stone_penalty = 20

# 以下三档：终盘为对方棋子、且该点位于本方团块内部（相邻的全部在盘内棋子都同色）。
# 角 / 边 / 常规分开设置，便于按"不同位置出现对方子的概率不同"分别调整；这一版取同值。
interior_stone_penalty_corner = 1.0     # 角：只有 2 个邻点
interior_stone_penalty_edge = 1.0       # 边：只有 3 个邻点
interior_stone_penalty_standard = 1.0   # 常规：4 个邻点


# -----------------------------------------------------------------------------
# [katago_loss] 动态 KataGo 点位损失
# -----------------------------------------------------------------------------
[katago_loss]

# 合法点概率的数值下限：点位损失取 -log(max(p, prob_floor))，避免 -log(0)。
# 非法点不取对数，直接剔除（热图中标 ×）。
prob_floor = 1e-20
